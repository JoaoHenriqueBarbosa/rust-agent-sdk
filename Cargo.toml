[package]
name = "prana"
version = "0.3.0"
edition = "2021"
# O maior piso das dependências é o do sqlx 0.9 (backend Postgres opcional).
rust-version = "1.94"
description = "Rust SDK for Claude agents: speaks the Claude Code CLI protocol and ships a native transport that runs the agent loop in-process"
license = "MIT"
repository = "https://github.com/JoaoHenriqueBarbosa/rust-agent-sdk"
homepage = "https://github.com/JoaoHenriqueBarbosa/rust-agent-sdk"
readme = "README.md"
authors = ["João Henrique Barbosa <joaohenriquebarbosa21@gmail.com>"]
keywords = ["claude", "agent", "llm", "anthropic", "sdk"]
categories = ["api-bindings", "asynchronous", "development-tools"]
exclude = [".github/", "release-plz.toml", "docs/", "target-*/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: os objetos JSON mantêm a ordem de inserção das chaves, que
# é a ordem que o CLI (JS) produz no `tool_use_result` e nos inputs.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
tokio-stream = "0.1"
unicode-normalization = "0.1"
libc = "0.2"
tempfile = "3"

# HTTP transport & API client
# gzip/deflate/brotli: o WebFetch pede e descomprime como o axios do CLI.
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls", "gzip", "deflate", "brotli"], default-features = false }
eventsource-stream = "0.2"
tokio-util = { version = "0.7", features = ["io", "rt"] }
bytes = "1"
pin-project-lite = "0.2"

# Tools
glob = "0.3"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
# Read: imagens redimensionadas e comprimidas como o `utils/imageResizer.js`
# do CLI (o sharp de lá). `png` e `color_quant` fazem o PNG com paleta
# (`png({ palette: true })` do sharp), que a crate `image` não grava.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
png = "0.18"
color_quant = "1.1"
# WebFetch: URL WHATWG (o `new URL` do JS) e o parser HTML5 (html5ever, o
# mesmo algoritmo do domino que o turndown do CLI usa) para o port do
# turndown em src/tools/html_to_markdown.rs.
url = "2"
html5ever = "0.38"
markup5ever_rcdom = "0.38"

# Retry
rand = "0.10"

# Optional session-store backends. Each is gated behind a feature so the
# default build (and the published core) stays free of heavy transport deps.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json"], optional = true }
redis = { version = "0.27", default-features = false, features = ["tokio-comp"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
pretty_assertions = "1"
filetime = "0.2"
serial_test = "3"
axum = "0.8"

[features]
default = []
integration-tests = []
# Postgres-backed SessionStore (src/stores/postgres.rs).
postgres = ["dep:sqlx"]
# Redis-backed SessionStore (src/stores/redis.rs).
redis-store = ["dep:redis"]
